name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: "0.10.7+bc794d341"

      - name: Show MoonBit Version
        run: moon version --all

      - name: moon fmt check
        run: moon fmt --check
        
      - name: moon info check
        run: moon info
        
      - name: moon check
        run: moon check --deny-warn

      - name: moon build
        run: moon build

      - name: moon test
        run: moon test --deny-warn

      - name: runnable example
        run: moon run src/main

      - name: benchmark smoke test
        run: moon run benchmarks
